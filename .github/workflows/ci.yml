name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-verify:
    name: test-and-verify (Python ${{ matrix.python-version }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]
        node-version: ["22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Unit & Integration Tests
        run: python -m unittest discover -s tests

      - name: Run Node.js Parity & Runtime Tests
        run: node --test tests/*.js

      - name: Validate itch.io Distribution Build
        run: python scripts/build_dist.py --campaign template_campaign

      - name: Validate itch.io Metadata Generation
        run: python scripts/itch_meta.py --campaign template_campaign --export-type single-file

      - name: Private Data Guard Check
        run: python scripts/build_dist.py --campaign template_campaign --verify-only
